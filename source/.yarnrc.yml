compressionLevel: mixed

enableGlobalCache: false

nodeLinker: node-modules

# DEVOPS-44489: build-nexus.alauda.cn (internal Alauda npm proxy) is
# unreachable from edge-build (confirmed live: yarn install ETIMEDOUT
# 192.168.156.101:443, a private IP that host resolves to). Swapped to the
# public default registry -- edge-build's own network already proved
# reachable to the public npm ecosystem moments earlier in the same run
# (corepack successfully fetched https://repo.yarnpkg.com/... just before
# this config is read). Same shape of fix as the cohort's established
# GOPROXY rewrite (gomod.alauda.cn -> gomod.alauda.io): internal Alauda
# artifact mirror unreachable -> swap to the reachable public equivalent.
npmRegistryServer: https://registry.npmjs.org/
