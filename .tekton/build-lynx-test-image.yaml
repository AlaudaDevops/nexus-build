apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: build-lynx-test-image
  annotations:
    pipelinesascode.tekton.dev/on-comment: "^/build-lynx-test-image$"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
spec:
  pipelineRef:
    resolver: hub
    params:
      - name: catalog
        value: alauda
      - name: type
        value: tekton
      - name: kind
        value: pipeline
      - name: name
        value: clone-image-build-test-scan
      - name: version
        value: "0.2"

  params:
    - name: git-url
      value: "{{ repo_url }}"
    - name: git-revision
      value: "{{ source_branch }}"
    - name: git-commit
      value: "{{ revision }}"
    - name: pull-request-number
      value: "{{ pull_request_number }}"
    - name: image-repository
      value: build-harbor.alauda.cn/devops/nexus-ce-test
    - name: containerfile-path
      value: testing/Containerfile
    - name: context
      value: "."
    - name: tags
      value:
        - v0.1.1-rchotfix.6.31.g1431efc-x-devops-44609-lynx-entrypoint
    - name: ignore-trivy-scan
      value: "true"
    - name: file-list-for-commit-sha
      value:
        - .tekton/build-lynx-test-image.yaml
        - testing/Containerfile
        - testing/lynx-entrypoint.sh
        - testing/lynx

  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteMany
          resources:
            requests:
              storage: 2Gi
    - name: registryconfig
      secret:
        secretName: build-harbor.kauto.docfj
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
    - name: gitversion-config
      configMap:
        name: gitversion-config

  taskRunTemplate:
    podTemplate:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch

  taskRunSpecs:
    - pipelineTaskName: prepare-build
      computeResources:
        requests:
          cpu: "2"
          memory: 2Gi
        limits:
          cpu: "4"
          memory: 4Gi
