mode: ContinuousDelivery
tag-prefix: '[vV]?'
semantic-version-format: Strict
branches:
  main:
    regex: ^(main|master)$
    label: beta
    increment: Minor
  release:
    regex: ^release-v?(?<version>[0-9]+[.][0-9]+(?:[.][0-9]+)?)$
    label: rc
    increment: Patch
    mode: ContinuousDelivery
  # DEVOPS-44489: this migration's own `migration` branch has no counterpart in
  # the shared ctyun-vm-integration-test Pipeline's built-in default
  # GitVersion.yaml (only main/master and release-* are declared there) --
  # confirmed live (nexus-integration-test-wrb2p/-8xgq9/-k2fp7): with no
  # matching branch entry AND only a single-ref shallow clone (no sibling
  # branch ref locally for GitVersion's ancestry-based "branch source"
  # detection, regardless of how many tags exist), `migration` is classified
  # an "orphaned branch" and skipped entirely -> GitVersionException: No base
  # versions determined. Modeled directly on the `main` entry above (a
  # mainline-style branch that does not depend on source-branch detection,
  # proven working) rather than inventing new semantics -- same label/
  # increment shape, just a different regex. Repo-local, reversible (this
  # file only feeds the shared Pipeline's internal test-image tag
  # computation; nexus-build's own product image tags are computed
  # separately by build-image.yaml's get-git-meta step, untouched).
  #
  # DEVOPS-44489 (2026-07-23, integration-test WO resume): regex widened
  # `^migration$` -> `^migration(-inttest)?$` after the build/inttest split
  # introduced a second long-lived branch, `migration-inttest` (MR !2). Same
  # exact failure mode reproduced live on the new branch name
  # (nexus-integration-test-9v6rl: "An orphaned branch 'migration-inttest'
  # has been detected... No base versions determined") -- the regex is the
  # only thing that changed, same label/increment shape as before.
  migration:
    regex: ^migration(-inttest)?$
    label: beta
    increment: Minor
